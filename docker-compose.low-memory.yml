# Experimental strict no-swap profile.
# IMPORTANT: 128 MiB for the ENTIRE VPS is not a supported target for public,
# multi-user API traffic. This profile is only for measuring startup/idle behavior.
# Build/publish this branch's image on a larger machine first.
services:
  khoorooth-router:
    image: khoorooth-router:low-memory
    container_name: khoorooth-router
    restart: unless-stopped
    ports:
      - "20128:20128"
    volumes:
      - khoorooth-router-data:/app/data
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      KHOROOTH_LOW_MEMORY: "1"
      KHOROOTH_H2C_MAX_BODY_BYTES: "8388608"
      NINEROUTER_PROXY_CLIENT_MAX_BODY_SIZE: "8mb"
      NODE_OPTIONS: "--max-old-space-size=40 --max-semi-space-size=2"
    mem_limit: 72m
    mem_reservation: 56m
    memswap_limit: 72m
    # No bundled Headroom container on this profile. Configure HEADROOM_URL
    # to a separate machine if your setup depends on it.
volumes:
  khoorooth-router-data:
    name: khoorooth-router-data
